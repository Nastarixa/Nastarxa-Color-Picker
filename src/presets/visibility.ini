[Meta]
Description=Toggle isolate mode and draft layer visibility on or off.

[PieQuickHotkeys]
Ids=vis_1|vis_2
[PieQuickHotkey_vis_1]
Label=Toggle Isolate Layer
Hotkey=q
Scope=all
Type=function
Action=HotkeyIsolateLayer
Requirement=nastar.laf
Color=1565C0
Enabled=1
Description=Toggle isolate mode on or off, hiding all layers except the selected one.
[PieQuickHotkey_vis_2]
Label=Toggle Draft Layers Visibility
Hotkey=w
Scope=all
Type=function
Action=HotkeyToggleDraft
Requirement=nastar.laf
Color=1565C0
Enabled=1
Description=Toggle the visibility of all layers marked as draft layers.
