[Meta]
Description=Open, close, expand, and collapse folder layers in the Layer palette.

[PieQuickHotkeys]
Ids=folder_1|folder_2|folder_3|folder_4|folder_5|folder_6
[PieQuickHotkey_folder_1]
Label=Open Folder
Hotkey=q
Scope=all
Type=function
Action=HotkeyOpenFolder
Requirement=nastar.laf
Color=F9A825
Enabled=1
Description=Open the selected folder layer without expanding all contents.
[PieQuickHotkey_folder_2]
Label=Close Folder
Hotkey=
Scope=all
Type=disabled
Action=
Requirement=
Color=E65100
Enabled=0
Description=Close the selected folder layer (set your shortcut if needed).
[PieQuickHotkey_folder_3]
Label=Open Folder and its Contents
Hotkey=e
Scope=all
Type=shortcut
Action=+!Y
Requirement=
Color=E65100
Enabled=1
Description=Open the selected folder and expand all layer contents within it.
[PieQuickHotkey_folder_4]
Label=Close Folder and its Contents
Hotkey=r
Scope=all
Type=shortcut
Action=+!I
Requirement=
Color=E65100
Enabled=1
Description=Close the selected folder and collapse all layer contents within it.
[PieQuickHotkey_folder_5]
Label=Open All Folders
Hotkey=t
Scope=all
Type=shortcut
Action=+W
Requirement=
Color=E65100
Enabled=1
Description=Expand every folder layer in the Layer palette.
[PieQuickHotkey_folder_6]
Label=Close All Folders
Hotkey=y
Scope=all
Type=function
Action=HotkeyCloseAllFolder
Requirement=nastar.laf
Color=E65100
Enabled=1
Description=Collapse every folder layer in the Layer palette.
