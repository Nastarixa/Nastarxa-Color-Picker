[Meta]
Description=Change keyframe/reference marks, layer color tags, color expression, and rasterize state.

[PieQuickHotkeys]
Ids=lc_1|lc_2|lc_3|lc_4|lc_5|lc_6
[PieQuickHotkey_lc_1]
Label=Set as Keyframe Color
Hotkey=q
Scope=all
Type=function
Action=HotkeyFeatureKeyframeColor(1)
Requirement=nastar.laf
Color=E53935
Enabled=1
Description=Mark the selected cel with a keyframe color for animation tracking.
[PieQuickHotkey_lc_2]
Label=Set as Reference Color
Hotkey=w
Scope=all
Type=function
Action=HotkeyFeatureReferenceColor(1)
Requirement=nastar.laf
Color=1565C0
Enabled=1
Description=Mark the selected layer or cel as a reference for animation.
[PieQuickHotkey_lc_3]
Label=Remove Keyframe Color
Hotkey=e
Scope=all
Type=function
Action=HotkeyFeatureRemoveLayerColor(1)
Requirement=nastar.laf
Color=546E7A
Enabled=1
Description=Remove the keyframe or reference color marking from the selected cel or layer.
[PieQuickHotkey_lc_4]
Label=Set Layer Color Black
Hotkey=r
Scope=all
Type=function
Action=HotkeyFeatureLayerColorBlack(1)
Requirement=nastar.laf
Color=1E1E1E
Enabled=1
Description=Change the selected layer's color tag to black.
[PieQuickHotkey_lc_5]
Label=Change Color Expression: Gray
Hotkey=t
Scope=all
Type=function
Action=HotkeyColorExpressionGray
Requirement=
Color=6D6D6D
Enabled=1
Description=Switch the selected layer's color expression to gray.
[PieQuickHotkey_lc_6]
Label=Rasterize Kumi Layer
Hotkey=y
Scope=all
Type=function
Action=HotkeyTransferRasterize
Requirement=
Color=6D6D6D
Enabled=1
Description=Merge the selected layer into the layer below, then rasterize it.
