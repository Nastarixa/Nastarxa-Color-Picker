[Meta]
Description=Duplicate a layer, create folder + insert layer, or ungroup a folder.

[PieQuickHotkeys]
Ids=dup_1|dup_2|dup_3
[PieQuickHotkey_dup_1]
Label=Duplicate Layer
Hotkey=q
Scope=all
Type=function
Action=HotkeyDuplicateLayer
Requirement=
Color=FF8F00
Enabled=1
Description=Duplicate the selected layer.
[PieQuickHotkey_dup_2]
Label=Create Folder + Insert Layer
Hotkey=w
Scope=all
Type=function
Action=HotkeyCreateFolderInsertLayer
Requirement=
Color=00897B
Enabled=1
Description=Create a new folder and move the selected layer into it.
[PieQuickHotkey_dup_3]
Label=Ungroup Layer Folder
Hotkey=e
Scope=all
Type=function
Action=HotkeyUngroupLayerFolder
Requirement=
Color=00897B
Enabled=1
Description=Ungroup (extract) all layers from the selected folder.
