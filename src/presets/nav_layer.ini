[Meta]
Description=Navigate up/down through layers and jump to top/bottom.

[PieQuickHotkeys]
Ids=navl_1|navl_2|navl_3|navl_4
[PieQuickHotkey_navl_1]
Label=Layer Up
Hotkey=q
Scope=all
Type=function
Action=HotkeyLayerUp(1)
Requirement=nastar.laf
Color=1565C0
Enabled=1
Description=Move layer selection up one layer.
[PieQuickHotkey_navl_2]
Label=Layer Down
Hotkey=w
Scope=all
Type=function
Action=HotkeyLayerDown(1)
Requirement=nastar.laf
Color=1565C0
Enabled=1
Description=Move layer selection down one layer.
[PieQuickHotkey_navl_3]
Label=Top Layer
Hotkey=e
Scope=all
Type=function
Action=HotkeyTopLayer(1)
Requirement=nastar.laf
Color=1565C0
Enabled=1
Description=Jump to the topmost layer in the Layer palette.
[PieQuickHotkey_navl_4]
Label=Bottom Layer
Hotkey=r
Scope=all
Type=function
Action=HotkeyBottomLayer(1)
Requirement=nastar.laf
Color=1565C0
Enabled=1
Description=Jump to the bottommost layer in the Layer palette.
