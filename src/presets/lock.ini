[Meta]
Description=Lock layers, lock transparency, lock animation cels, set reference/draft layers, and clip.

[PieQuickHotkeys]
Ids=lock_1|lock_2|lock_3|lock_4|lock_5|lock_6|lock_7
[PieQuickHotkey_lock_1]
Label=Lock Layer
Hotkey=q
Scope=all
Type=function
Action=HotkeyLockLayer
Requirement=
Color=E65100
Enabled=1
Description=Lock or unlock the selected layer to prevent editing.
[PieQuickHotkey_lock_2]
Label=Lock Transparent
Hotkey=w
Scope=all
Type=function
Action=HotkeyLockTransparent
Requirement=
Color=E65100
Enabled=1
Description=Toggle transparent pixel lock on the selected layer.
[PieQuickHotkey_lock_3]
Label=Lock Animation Cel
Hotkey=e
Scope=all
Type=function
Action=HotkeyLockAnimationCel
Requirement=
Color=E65100
Enabled=1
Description=Lock or unlock the current animation cel to prevent editing.
[PieQuickHotkey_lock_4]
Label=Set as Reference Layer
Hotkey=r
Scope=all
Type=function
Action=HotkeyReferenceLayer
Requirement=
Color=1565C0
Enabled=1
Description=Set the selected layer as a reference layer.
[PieQuickHotkey_lock_5]
Label=Isolate Layer
Hotkey=t
Scope=all
Type=function
Action=HotkeyIsolateLayer
Requirement=nastar.laf
Color=1565C0
Enabled=1
Description=Isolate the selected layer, hiding all others.
[PieQuickHotkey_lock_6]
Label=Set as Draft Layer
Hotkey=y
Scope=all
Type=function
Action=HotkeyDraftLayer
Requirement=
Color=1565C0
Enabled=1
Description=Mark the selected layer as a draft layer.
[PieQuickHotkey_lock_7]
Label=Clip to Layer Below
Hotkey=u
Scope=all
Type=function
Action=HotkeyClipToLayerBelow
Requirement=
Color=1565C0
Enabled=1
Description=Toggle clipping mask on the selected layer to the layer below.
