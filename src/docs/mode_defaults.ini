; CSP Animator Toolkit — Built-in Mode Default Hotkeys
; ============================================================
; This file is the authoritative source of truth for what each built-in
; mode's hotkeys reset to.  Reset Sel / Reset All in the Hotkey Settings
; editor reads this file.
;
; Generated from ModeSettingsEnsureBuiltInDefaults() seed logic.
; Editing this file manually has no effect on the running toolkit — it is
; only consumed by the Reset functions.
;
; Format:  [Mode_<modeId>]
;          hotkey_id=key_value
;
; A blank value or key = "-" means the hotkey is disabled in that mode.

; ------------------------------------------------------------
; Default mode
; No overrides — every hotkey uses its compiled default from
; HotkeyDefs.  Only painting isolation keys are seeded here
; (paint_red=-, etc.) to keep painting hotkeys silent outside
; Painting mode.
; ------------------------------------------------------------
[Mode_default]
paint_red=-
paint_green=-
paint_blue=-
paint_pink=-
paint_cyan=-
paint_orange=-
paint_purple=-
set_to_paint_anim=-
paint_checker_single=-
paint_checker_image=-
delete_paint_checker=-
create_6=-
layer_9=-

; ------------------------------------------------------------
; Setup mode
; Painting hotkeys disabled (same as Default).  Features mapped
; to number keys 1-3; set_cels_to_track mapped to Q.
; ------------------------------------------------------------
[Mode_setup]
paint_red=-
paint_green=-
paint_blue=-
paint_pink=-
paint_cyan=-
paint_orange=-
paint_purple=-
set_to_paint_anim=-
paint_checker_single=-
paint_checker_image=-
delete_paint_checker=-
create_6=-
layer_9=-
set_cels_to_track=q
feature_kf=1
feature_ref=2
feature_rm=3

; ------------------------------------------------------------
; Tracing mode
; Painting hotkeys disabled.  toggle_lt and toggle_onion swapped:
; toggle_lt overridden to Alt+W (default Ctrl+Alt+W),
; toggle_onion overridden to Ctrl+Alt+W (default Alt+W).
; A/D swapped so bare A/D select cels and Alt+A/Alt+D move frames.
; ------------------------------------------------------------
[Mode_tracing]
paint_red=-
paint_green=-
paint_blue=-
paint_pink=-
paint_cyan=-
paint_orange=-
paint_purple=-
set_to_paint_anim=-
paint_checker_single=-
paint_checker_image=-
delete_paint_checker=-
create_6=-
layer_9=-
toggle_lt=!w|^!w
toggle_onion=-
select_prev_cel=a
select_next_cel=d
prev_frame=$!a
next_frame=$!d

; ------------------------------------------------------------
; Animate mode
; Painting hotkeys disabled.  A/D swapped (same as Tracing).
; ------------------------------------------------------------
[Mode_animate]
paint_red=-
paint_green=-
paint_blue=-
paint_pink=-
paint_cyan=-
paint_orange=-
paint_purple=-
set_to_paint_anim=-
paint_checker_single=-
paint_checker_image=-
delete_paint_checker=-
create_6=-
layer_9=-
select_prev_cel=a
select_next_cel=d
prev_frame=$!a
next_frame=$!d

; ------------------------------------------------------------
; Painting mode
; Painting hotkeys active with number-key bindings.  A/D
; swapped (same as Tracing/Animate).
; ------------------------------------------------------------
[Mode_painting]
paint_red=1
paint_green=2
paint_blue=3
paint_pink=4
paint_cyan=5
paint_orange=6
paint_purple=7
set_to_paint_anim=q
create_6=y
paint_checker_single=e
paint_checker_image=r
delete_paint_checker=t
layer_9=s
feature_paper_white=+1
feature_paper_purple=+2
feature_paper_green=+3
ref_layer=w
layer_1=-
layer_2=-
layer_3=-
select_prev_cel=a
select_next_cel=d
prev_frame=$!a
next_frame=$!d
